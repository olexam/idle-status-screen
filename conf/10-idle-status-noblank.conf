# Installed by idle-status-screen: disable X screen saver and DPMS blanking,
# so the login screen / X sessions never blank the display on inactivity.
# To override, put your own settings in /etc/X11/xorg.conf.d/.
Section "ServerFlags"
    Option "BlankTime"   "0"
    Option "StandbyTime" "0"
    Option "SuspendTime" "0"
    Option "OffTime"     "0"
EndSection

Section "Extensions"
    Option "DPMS" "false"
EndSection
