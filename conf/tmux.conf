# tmux for the idle status screen: no status bar, no key bindings.
# The service user has no login shell, so run commands with /bin/sh.
set -g default-shell /bin/sh
set -g status off
set -g prefix None
set -g prefix2 None
unbind-key -a
set -g mouse off
set -g escape-time 0
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
# Initial size, close to the kmscon console size, so graphs collect history
# at the right width before the first attach. Resized on attach anyway.
set -g default-size 102x91
set -g window-size latest
set -g history-limit 100
