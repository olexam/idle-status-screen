# btop config for the idle status screen (read-only, not saved on exit)
color_theme = "Default"
theme_background = true
truecolor = true
force_tty = false
vim_keys = false
disable_mouse = true
rounded_corners = true
graph_symbol = "braille"
shown_boxes = "cpu mem net proc"
update_ms = 500
proc_sorting = "cpu lazy"
proc_tree = false
check_temp = true
show_coretemp = true
show_cpu_freq = true
show_uptime = true
clock_format = "%X"
background_update = true
show_disks = true
only_physical = true
net_auto = true
log_level = "WARNING"
save_config_on_exit = false
