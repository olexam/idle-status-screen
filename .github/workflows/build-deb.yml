name: Build .deb

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - name: Install build tools
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            build-essential debhelper python3 shellcheck lintian git ca-certificates

      - uses: actions/checkout@v4

      - name: Check sources
        run: make check

      - name: Build package
        run: make deb

      - name: Lintian
        run: lintian --no-tag-display-limit dist/*.deb || true

      - uses: actions/upload-artifact@v4
        with:
          name: idle-status-screen-deb
          path: dist/*.deb

      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.deb
